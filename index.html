 await wear(k,first);if(first)$('#stage').classList.add('ready');

 if(p.embed){const f=document.createElement('iframe');f.src=p.embed;f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.title=p.title;m.append(f)}
 else if(p.video){const v=document.createElement('video');v.src=p.video;v.controls=true;v.playsInline=true;m.append(v)}
 else m.textContent='Aquí irá el video de este proyecto.';dlg.showModal()}

 if(!url){e.preventDefault();return notify('Este enlace aún no está configurado.')}a.href=url;if(k!=='email'){a.target='_blank';a.rel='noopener noreferrer'}}));
