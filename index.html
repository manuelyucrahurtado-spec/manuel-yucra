// Dos grupos idénticos. Cada grupo repite las 3 marcas varias veces para superar el ancho de pantalla;
// al desplazarse exactamente un grupo, el segundo ocupa su lugar sin cortes visibles.
function makeLogoGroup(dup){
 const group=document.createElement('div');group.className='logo-group';if(dup)group.setAttribute('aria-hidden','true');
 Array.from({length:4},()=>CLIENTS).forEach((list,n)=>list.forEach(c=>{const el=document.createElement('span');el.className='client-logo';el.title=c.name;el.style.setProperty('--h',c.h+'px');el.innerHTML=`<img src="${c.src}" alt="${dup||n?'':esc(c.name)}">`;group.append(el)}));
 return group}
logoTrack.append(makeLogoGroup(false),makeLogoGroup(true));

const doll=$('#doll'),floor=$('#floor');
let role=location.hash.slice(1),filter='motion',cur=null,tok=0;
if(!ROLES[role])role='motion';
const cache={};const load=k=>cache[k]||(cache[k]=(()=>{const i=new Image();i.src=SRC[k];i.alt='';return i.decode().catch(()=>{}).then(()=>i)})());
Object.keys(ROLES).forEach(load);
const base=new Image();base.src=SRC.base;base.alt='Avatar ilustrado de Manuel Yucra';doll.append(base);
['grafico','motion','director','batman','jedi'].forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',LABELS[k][1]);b.innerHTML=`<span class="btn-emoji">${LABELS[k][0]}</span><span class="btn-title">${LABELS[k][1]}</span>`;b.onclick=()=>setRole(k);$('#opts').append(b)});
const IN=reduce?[{opacity:0},{opacity:1}]:[{transform:'translateY(-90px) rotate(-3deg)',opacity:0},{transform:'translateY(8px) rotate(.6deg)',opacity:1,offset:.62},{transform:'none',opacity:1}];
const OUT=reduce?[{opacity:1},{opacity:0}]:[{transform:'none',opacity:1},{transform:'translateY(50px)',opacity:0}];
async function wear(k,first){
 const my=++tok,img=(await load(k)).cloneNode();if(my!==tok)return;
 const old=cur;cur=img;doll.append(img);if(first)return;
 img.animate(IN,{duration:700,easing:'cubic-bezier(.3,.7,.4,1)'});
 floor.animate([{transform:'scaleX(.7)',opacity:.4},{transform:'scaleX(.7)',opacity:.4,offset:.5},{transform:'scaleX(1.08)',opacity:1,offset:.62},{transform:'none',opacity:1}],{duration:700});
 if(old)old.animate(OUT,{duration:300,easing:'ease-in',fill:'forwards'}).finished.then(()=>old.remove()).catch(()=>old.remove());
}
function colCount(){return innerWidth>860?4:2}
let lastCols=0,rt;
function renderWork(){
 const names={all:'Todos los trabajos',motion:'Trabajos de motion',grafico:'Trabajos de diseño',director:'Trabajos de dirección'};
 $('#wt').textContent=names[filter];$$('#sw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
 const n=colCount();lastCols=n;const grid=$('#grid');grid.replaceChildren();
 const cols=Array.from({length:n},()=>{const c=document.createElement('div');c.className='col';grid.append(c);return c}),hs=Array(n).fill(0);
 PROJECTS.filter(p=>filter==='all'||p.role===filter).forEach(p=>{
  const [a,b]=String(p.ratio).split('/').map(Number);const k=hs.indexOf(Math.min(...hs));hs[k]+=(b||1)/(a||1);
  const el=document.createElement('div');el.className='project';el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','Ver proyecto: '+p.title);
  el.innerHTML=`<div class="preview${p.yt?' has-youtube':''}" style="aspect-ratio:${esc(p.ratio)}">${p.thumb?`<img class="th" src="${esc(p.thumb)}" alt="" loading="lazy" decoding="async">`:''}${p.loop?`<video src="${esc(p.loop)}" muted loop playsinline preload="none"></video>`:''}</div><h3>${esc(p.title)}</h3>`;
  const img=el.querySelector('img.th');
  if(img)img.onerror=()=>{if(img.dataset.f==='1'||!p.yt){img.remove();el.querySelector('.preview').classList.add('noimg');return}img.dataset.f='1';img.src=`https://i.ytimg.com/vi/${p.yt}/hqdefault.jpg`};
  const v=el.querySelector('video');let t;
  if(canHover){
   el.onmouseenter=()=>{if(v)v.play();else if(p.preview)t=setTimeout(()=>{const f=document.createElement('iframe');f.className='yt-preview';f.style.opacity=0;f.onload=()=>{f.style.opacity=1};f.src=p.preview;f.title='Vista previa de '+p.title;f.allow='autoplay; encrypted-media';el.querySelector('.preview').append(f)},280)};
   el.onmouseleave=()=>{clearTimeout(t);if(v){v.pause();v.currentTime=0}el.querySelectorAll('iframe.yt-preview').forEach(f=>f.remove())};
  }
  el.onclick=()=>openProject(p);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProject(p)}};
  cols[k].append(el)});
}
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(colCount()!==lastCols)renderWork()},180)});
function hang(){const h=$('.hang');if(!h)return;h.style.marginLeft='0';const w=h.getBoundingClientRect().width,fs=parseFloat(getComputedStyle(h).fontSize);h.style.marginLeft=-(w/fs)+'em'}
document.fonts&&document.fonts.ready.then(hang);

async function setRole(k,first){
 if(!first&&k===role)return;role=k;const r=ROLES[k];document.body.dataset.role=k;history.replaceState(null,'','#'+k);
 if(!first){const g=$('#glass'),ab=$('#opts button[data-k="'+k+'"]');g.classList.remove('flash');void g.offsetWidth;g.classList.add('flash');ab.classList.remove('pulse');void ab.offsetWidth;ab.classList.add('pulse')}
 $('#q').innerHTML='<span class="hang">¿</span>'+esc(r.q.slice(1));hang();$('#ans').innerHTML=`<span class="v">${r.v==='Sí'?'✅':'❌'} ${r.v}</span>${esc(r.a)}`;$('#cta').textContent=r.cta+' →';
 $$('#opts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
 filter=r.f;renderWork();showItems(k,first);
 if(!first&&!reduce)['#q','#ans','#cta'].forEach((s,i)=>$(s).animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:420,delay:i*70,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
 await wear(k,first);if(first)$('#stage').classList.add('ready');
}
$$('#sw button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderWork()});
const dlg=$('#dlg');
function openProject(p){$('#dt').textContent=p.title;$('#dd').textContent=p.desc;const m=$('#media');m.replaceChildren();
 if(p.embed){const f=document.createElement('iframe');f.src=p.embed;f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';f.allowFullscreen=true;f.title=p.title;m.append(f)}
 else if(p.video){const v=document.createElement('video');v.src=p.video;v.controls=true;v.playsInline=true;m.append(v)}
 else m.textContent='Aquí irá el video de este proyecto.';dlg.showModal()}
dlg.addEventListener('close',()=>$('#media').replaceChildren());$('.x').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()});
function openReel(){const m=$('#reel-media');m.replaceChildren();const u=CONFIG.demoreel,f=document.createElement('iframe');f.src=u+(u.includes('?')?'&':'?')+'autoplay=1';f.title='Demoreel 2026 de Manuel Yucra';f.allow='autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share';f.referrerPolicy='strict-origin-when-cross-origin';f.allowFullscreen=true;m.append(f);$('#reel-dlg').showModal()}
const toast=$('.toast');let tm;const notify=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('show'),3500)};
$$('[data-link]').forEach(a=>a.addEventListener('click',e=>{const k=a.dataset.link,c=CONFIG;
 if(k==='demoreel'){e.preventDefault();return openReel()}
 const url={email:c.email&&'mailto:'+c.email,whatsapp:c.whatsapp&&'https://wa.me/'+c.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('Hola Manuel, vi tu portafolio y me gustaría hablar de un proyecto.'),linkedin:c.linkedin,vimeo:c.vimeo,instagram:c.instagram,cv:c.cv}[k];
 if(!url){e.preventDefault();return notify('Este enlace aún no está configurado.')}a.href=url;if(k==='cv'){a.download='Manuel-Yucra-CV-2026.pdf'}else if(k!=='email'){a.target='_blank';a.rel='noopener noreferrer'}}));
const reelDlg=$('#reel-dlg');reelDlg.addEventListener('close',()=>$('#reel-media').replaceChildren());$('.reel-x').onclick=()=>reelDlg.close();
reelDlg.addEventListener('click',e=>{const r=reelDlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)reelDlg.close()});
$('#copy-mail').onclick=async()=>{if(!CONFIG.email)return notify('Agrega tu correo en CONFIG.');try{await navigator.clipboard.writeText(CONFIG.email);notify('Correo copiado.')}catch{notify(CONFIG.email)}};
$('#year').textContent=new Date().getFullYear();
Promise.all([base.decode().catch(()=>{}),load(role)]).then(()=>setRole(role,true));
